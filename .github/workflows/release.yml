name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Версия в package.json должна совпадать с тегом
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run site
      - name: Упаковка статической страницы
        run: |
          name="plan-postcard-${GITHUB_REF_NAME}"
          mkdir -p "dist-pack/$name"
          cp -r site/. "dist-pack/$name/"
          cp README.md LICENSE "dist-pack/$name/"
          tar -C dist-pack -czf "dist-pack/$name.tar.gz" "$name"
          rm -rf "dist-pack/$name"
          (cd dist-pack && sha256sum *.tar.gz > SHA256SUMS && cat SHA256SUMS)
      - name: Подтверждение происхождения (provenance)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dist-pack/*.tar.gz
      - name: Публикация релиза
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist-pack/*.tar.gz dist-pack/SHA256SUMS
          --title "plan-postcard $GITHUB_REF_NAME"
          --notes "Готовая статическая страница (откройте index.html или положите на любой хостинг): сравнение планов EXPLAIN PostgreSQL в браузере. Онлайн: https://oleg4311.github.io/plan-postcard/. Проверьте SHA-256 из SHA256SUMS и аттестацию: gh attestation verify <файл> --repo Oleg4311/plan-postcard."
